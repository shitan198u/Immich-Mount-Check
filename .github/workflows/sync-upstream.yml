name: Sync Upstream Immich Compose

on:
  schedule:
    # Runs at 00:00 every Sunday (weekly)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual run from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Fetch and Check Upstream Release
        run: |
          # 1. Fetch the latest release tag name from official Immich repository
          LATEST_TAG=$(curl --fail -s https://api.github.com/repos/immich-app/immich/releases/latest | jq -r .tag_name)
          if [[ -z "${LATEST_TAG}" || "${LATEST_TAG}" == "null" ]]; then
            echo "[ERROR] Failed to fetch latest upstream release tag." >&2
            exit 1
          fi
          echo "Latest upstream Immich release tag is $LATEST_TAG"
          echo "LATEST_TAG=${LATEST_TAG}" >> $GITHUB_ENV

          # 2. Download the docker-compose and hardware acceleration files
          curl --fail -sL "https://github.com/immich-app/immich/releases/download/$LATEST_TAG/docker-compose.yml" -o docker-compose.yml.new
          curl --fail -sL "https://github.com/immich-app/immich/releases/download/$LATEST_TAG/docker-compose.rootless.yml" -o docker-compose.rootless.yml.new
          curl --fail -sL "https://github.com/immich-app/immich/releases/download/$LATEST_TAG/hwaccel.transcoding.yml" -o hwaccel.transcoding.yml.new || true
          curl --fail -sL "https://github.com/immich-app/immich/releases/download/$LATEST_TAG/hwaccel.ml.yml" -o hwaccel.ml.yml.new || true

          # 3. Check if download succeeded and is valid yaml before replacing local files
          if grep -q "services" docker-compose.yml.new && grep -q "services" docker-compose.rootless.yml.new; then
            UPDATED=false
            for f in docker-compose.yml docker-compose.rootless.yml hwaccel.transcoding.yml hwaccel.ml.yml; do
              if [[ -f "${f}.new" ]]; then
                if ! cmp -s "$f" "${f}.new" 2>/dev/null; then
                  mv "${f}.new" "$f"
                  UPDATED=true
                else
                  rm -f "${f}.new"
                fi
              fi
            done
            echo "UPDATED=${UPDATED}" >> $GITHUB_ENV
            if [[ "${UPDATED}" == "true" ]]; then
              echo "New version detected and local files updated."
            else
              echo "Local files are already up-to-date with upstream release."
            fi
          else
            echo "UPDATED=false" >> $GITHUB_ENV
            echo "Error: Downloaded files are invalid or incomplete."
            rm -f *.new
            exit 1
          fi

      - name: Validate Compose Config with Local Override
        if: env.UPDATED == 'true'
        run: |
          # Validate that upstream compose file remains fully compatible with our override
          cp .env.example .env
          docker compose config -q
          rm -f .env

      - name: Commit and Push Changes
        if: env.UPDATED == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml docker-compose.rootless.yml hwaccel.transcoding.yml hwaccel.ml.yml
          git commit -m "Auto-update Immich compose files to upstream release ${LATEST_TAG}"
          git push origin main
