services:
  wait-for-mount:
    image: alpine:latest
    container_name: wait-for-mount
    restart: "no"
    # Checks if the subdirectory is a mountpoint.
    # If the drive isn't mounted, /host_mnt/drive is just a standard folder
    # so 'mountpoint' returns false.
    command: >
      sh -c "
      echo 'Waiting for host mount at /host_mnt/${EXTERNAL_MOUNT_NAME} to be active...' &&
      while ! mountpoint -q \"/host_mnt/${EXTERNAL_MOUNT_NAME}\"; do
        echo 'Still waiting for mount...' &&
        sleep 5;
      done &&
      echo 'Mount detected at /host_mnt/${EXTERNAL_MOUNT_NAME}!'
      "
    volumes:
      # Bind-mount ONLY the parent directory of your external drives (e.g. /media/username)
      # set propagation to 'rslave' so mount events propagate from host to container.
      - type: bind
        source: ${EXTERNAL_MOUNT_PARENT}
        target: /host_mnt
        read_only: true
        bind:
          create_host_path: false
          propagation: rslave

  immich-server:
    depends_on:
      wait-for-mount:
        condition: service_completed_successfully
    volumes:
      # Override the upload volume mount with fail-fast creation and slave propagation.
      - type: bind
        source: ${UPLOAD_LOCATION}
        target: /data
        bind:
          create_host_path: false
          propagation: rslave

  database:
    depends_on:
      wait-for-mount:
        condition: service_completed_successfully
    volumes:
      # Override the database volume mount with fail-fast creation and slave propagation.
      - type: bind
        source: ${DB_DATA_LOCATION}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
          propagation: rslave

  immich-machine-learning:
    depends_on:
      wait-for-mount:
        condition: service_completed_successfully

  redis:
    depends_on:
      wait-for-mount:
        condition: service_completed_successfully
