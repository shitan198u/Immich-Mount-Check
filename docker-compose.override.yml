services:
  wait-for-mount:
    image: alpine:latest
    container_name: wait-for-mount
    # Checks if the subdirectory (e.g. BOREWELL-5TB) is a mountpoint.
    # If the drive isn't mounted, /host_mnt/BOREWELL-5TB is just a standard folder
    # (even if it contains lingering files), so 'mountpoint' returns false.
    command: >
      sh -c "
      echo 'Waiting for host mount at /host_mnt/${EXTERNAL_MOUNT_NAME} to be active...' &&
      while true; do
        if mountpoint -q /host_mnt/${EXTERNAL_MOUNT_NAME}; then
          echo 'Mount detected!' &&
          touch /tmp/.mount_ready &&
          break;
        fi;
        echo 'Still waiting for mount...' &&
        sleep 5;
      done &&
      tail -f /dev/null
      "
    volumes:
      # Bind-mount ONLY the parent directory of your external drives (e.g. /media/shsrra)
      # set propagation to 'rslave' so mount events propagate from host to container.
      - type: bind
        source: ${EXTERNAL_MOUNT_PARENT}
        target: /host_mnt
        read_only: true
        bind:
          create_host_path: false
          propagation: rslave
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/.mount_ready"]
      interval: 5s
      timeout: 2s
      retries: 1
      start_period: 2s
    restart: unless-stopped

  immich-server:
    depends_on:
      wait-for-mount:
        condition: service_healthy
    volumes:
      # Override the upload volume mount with fail-fast creation and slave propagation.
      - type: bind
        source: ${UPLOAD_LOCATION}
        target: /data
        bind:
          create_host_path: false
          propagation: rslave

  database:
    depends_on:
      wait-for-mount:
        condition: service_healthy
    volumes:
      # Override the database volume mount with fail-fast creation and slave propagation.
      - type: bind
        source: ${DB_DATA_LOCATION}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
          propagation: rslave

  immich-machine-learning:
    depends_on:
      wait-for-mount:
        condition: service_healthy

  redis:
    depends_on:
      wait-for-mount:
        condition: service_healthy
